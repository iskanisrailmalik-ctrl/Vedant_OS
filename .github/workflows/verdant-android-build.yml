name: Verdant OS — Bootstrap and Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-and-build:
    name: Verify source and build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Verify staged source chunks and extract project
        run: python3 .github/scripts/assemble_source.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Update SDK command-line tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "cmdline-tools;latest"
          sdkmanager --update

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate project structure
        working-directory: project
        run: python3 scripts/verify_project.py

      - name: Run tests, lint, and assemble debug APK
        working-directory: project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test lint :app:assembleDebug --stacktrace

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android 16 emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb logcat -c
            adb install -r project/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.verdant.os/.MainActivity
            sleep 8
            pid="$(adb shell pidof -s com.verdant.os | tr -d '\r')"
            if [ -z "$pid" ]; then
              echo "Verdant OS process not running after launch."
              adb logcat -d -t 4000
              exit 1
            fi
            if adb logcat -d -s AndroidRuntime:E | grep -E "FATAL EXCEPTION|Process: com\\.verdant\\.os"; then
              echo "Fatal Android runtime error detected after launch."
              exit 1
            fi
            echo "Verdant OS launched successfully on Android 16 emulator (PID $pid)."

      - name: Upload debug APK
        if: always() && hashFiles('project/app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verdant-os-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
