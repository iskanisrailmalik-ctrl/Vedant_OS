name: Verdant OS — Bootstrap and Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-and-build:
    name: Verify source and build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: '3.12'

      - name: Verify staged source chunks and extract project
        run: python3 .github/scripts/assemble_source.py

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate project structure
        working-directory: project
        run: python3 scripts/verify_project.py

      - name: Run tests, lint, and assemble debug APK
        working-directory: project
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon test lint :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: always() && hashFiles('project/app/build/outputs/apk/debug/*.apk') != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verdant-os-debug-apk
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
